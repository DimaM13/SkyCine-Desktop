name: Build FastWarp Vulkan Plugin

on:
  push:
    paths:
      - 'src-fastwarp/**'
      - '.github/workflows/build-fastwarp.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Vulkan SDK
        uses: jakoch/install-vulkan-sdk-action@v1
        with:
          version: latest
          cache: true

      - name: Configure CMake
        run: |
          cmake -B build-fastwarp -S src-fastwarp -DCMAKE_BUILD_TYPE=Release

      - name: Build Plugin DLL
        run: |
          cmake --build build-fastwarp --config Release

      - name: Upload librife_fastwarp.dll Artifact
        uses: actions/upload-artifact@v4
        with:
          name: librife_fastwarp
          path: build-fastwarp/Release/librife_fastwarp.dll
